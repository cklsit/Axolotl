name: iOS build

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run'
        required: true
        default: probe
        type: choice
        options:
          - probe
          - package
  push:
    branches:
      - ios/port
    paths:
      - '.github/workflows/ios-build.yml'
      - 'apps/app/**'
      - 'packages/app-lib/**'
      - 'packages/daedalus/**'
      - 'packages/content-management/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: 'true'

jobs:
  probe:
    name: Probe iOS target compilation
    if: inputs.stage == 'probe' || github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ios-aarch64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build resources
        run: node scripts/axolotl/prepare-build-resources.mjs

      - name: Initialize iOS project
        id: init
        continue-on-error: true
        shell: bash
        run: |
          brew install xcodegen
          cd apps/app
          pnpm exec tauri ios init --ci 2>&1 | tee "$RUNNER_TEMP/ios-init.log"

      - name: Check theseus for iOS
        id: theseus
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --keep-going --target aarch64-apple-ios -p theseus --message-format=short 2>&1 | tee "$RUNNER_TEMP/theseus.log"
          echo "exit=$?" >> "$RUNNER_TEMP/theseus.status"

      - name: Check theseus_gui for iOS
        id: shell
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo check --keep-going --target aarch64-apple-ios --lib -p theseus_gui --message-format=short 2>&1 | tee "$RUNNER_TEMP/shell.log"
          echo "exit=$?" >> "$RUNNER_TEMP/shell.status"

      - name: Summarize failures
        shell: bash
        run: |
          for name in theseus shell; do
            echo "### $name" >> "$GITHUB_STEP_SUMMARY"
            log="$RUNNER_TEMP/$name.log"
            if [ -f "$log" ]; then
              grep -E '^error(\[E[0-9]+\])?:' "$log" | sort | uniq -c | sort -rn | head -40 >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              grep -E 'error: could not compile' "$log" | head -40 >> "$GITHUB_STEP_SUMMARY" || true
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'no log' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-probe-logs
          path: |
            ${{ runner.temp }}/theseus.log
            ${{ runner.temp }}/shell.log
            ${{ runner.temp }}/ios-init.log
            ${{ runner.temp }}/*.status
          overwrite: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload generated iOS project
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-project
          path: |
            apps/app/gen/apple
            !apps/app/gen/apple/build
          overwrite: true
          retention-days: 7
          if-no-files-found: warn

  package:
    name: Package unsigned iOS app
    if: inputs.stage == 'package'
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Rust target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add aarch64-apple-ios

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          key: ios-aarch64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build resources
        shell: bash
        run: |
          resources="$(pwd)/target/build-resources"
          node scripts/axolotl/prepare-build-resources.mjs --output "$resources"
          echo "AXOLOTL_BUILD_RESOURCES=$resources" >> "$GITHUB_ENV"
          node scripts/axolotl/prepare-build-resources.mjs --consume --output "$resources"

      - name: Initialize iOS project
        shell: bash
        run: |
          brew install xcodegen
          cd apps/app
          pnpm exec tauri ios init --ci
          cd ../..
          node scripts/axolotl/patch-ios-project.mjs

      - name: Restore the staged runtime
        id: runtime-cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/app/gen/apple/GameRuntime
          key: ios-runtime-${{ hashFiles('apps/app/ios/**') }}-f98c4133-jre21

      - name: Stage the game runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          runtime_root="$(pwd)/apps/app/gen/apple/GameRuntime/java_runtimes"
          mkdir -p "$runtime_root"
          curl -fsSL -o "$RUNNER_TEMP/jre21.zip" \
            https://assets.angelauramc.dev/openjdk/ios-arm64/jre21-ios-aarch64.zip
          unzip -q "$RUNNER_TEMP/jre21.zip" -d "$RUNNER_TEMP/jre21"
          archive="$(find "$RUNNER_TEMP/jre21" -name '*.tar.xz' -print -quit)"
          test -n "$archive"
          mkdir -p "$runtime_root/jre21"
          tar -xJf "$archive" -C "$runtime_root/jre21" --strip-components=1
          test -f "$runtime_root/jre21/release"
          test -f "$runtime_root/jre21/lib/server/libjvm.dylib"
          test -f "$runtime_root/jre21/lib/libjli.dylib"
          du -sh "$runtime_root/jre21"

      - name: Stage the game libraries
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          commit=f98c4133c72d39e06ceac42b57cc4477c52105fc
          base="https://raw.githubusercontent.com/AngelAuraMC/Amethyst-iOS/$commit"
          runtime_root="$(pwd)/apps/app/gen/apple/GameRuntime"
          mkdir -p "$runtime_root/libs" "$runtime_root/natives"
          for jar in lwjgl.jar lwjgl-glfw.jar lwjgl-opengl.jar lwjgl-openal.jar lwjgl-stb.jar lwjgl-tinyfd.jar lwjgl-freetype.jar; do
            curl -fsSL -o "$runtime_root/libs/$jar" "$base/JavaApp/libs/lwjgl/$jar"
          done
          for library in libgl4es_114.dylib libopenal.dylib liblwjgl.dylib liblwjgl_opengl.dylib liblwjgl_stb.dylib liblwjgl_tinyfd.dylib; do
            curl -fsSL -o "$runtime_root/natives/$library" "$base/Natives/resources/Frameworks/$library"
          done
          for framework in libEGL libGLESv2; do
            mkdir -p "$runtime_root/Frameworks/$framework.framework"
            curl -fsSL -o "$runtime_root/Frameworks/$framework.framework/Info.plist" "$base/Natives/resources/Frameworks/$framework.framework/Info.plist"
            curl -fsSL -o "$runtime_root/Frameworks/$framework.framework/$framework" "$base/Natives/resources/Frameworks/$framework.framework/$framework"
          done
          test -f "$runtime_root/libs/lwjgl.jar"
          test -f "$runtime_root/natives/libgl4es_114.dylib"
          test -f "$runtime_root/Frameworks/libEGL.framework/libEGL"
          du -sh "$runtime_root/libs" "$runtime_root/natives" "$runtime_root/Frameworks"

      - name: Build the desktop GL bridge
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          commit=f98c4133c72d39e06ceac42b57cc4477c52105fc
          base="https://raw.githubusercontent.com/AngelAuraMC/Amethyst-iOS/$commit"
          runtime_root="$(pwd)/apps/app/gen/apple/GameRuntime"
          source="$RUNNER_TEMP/tinygl4angle"
          mkdir -p "$source"
          curl -fsSL -o "$source/tinygl4angle.c" "$base/Natives/external/gl4es/tinygl4angle.c"
          curl -fsSL -o "$source/string_utils.c" "$base/Natives/external/gl4es/string_utils.c"
          curl -fsSL -o "$source/string_utils.h" "$base/Natives/external/gl4es/string_utils.h"
          for header in GL/gl.h GL/glext.h GL/glcorearb.h KHR/khrplatform.h; do
            mkdir -p "$source/$(dirname "$header")"
            curl -fsSL -o "$source/$header" "$base/Natives/external/mesa/$header"
          done
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          # The library exports the desktop OpenGL entry points the game calls and
          # forwards them to the translation layer's own suffixed exports. Its
          # sources import Foundation, so they compile as Objective-C.
          clang -dynamiclib -arch arm64 -isysroot "$sdk" -mios-version-min=16.0 \
            -x objective-c \
            -I"$source" \
            -F"$runtime_root/Frameworks" -framework libEGL -framework libGLESv2 \
            -Wl,-rpath,@loader_path/../Frameworks \
            -framework Foundation \
            "$source/tinygl4angle.c" "$source/string_utils.c" \
            -o "$runtime_root/natives/libtinygl4angle.dylib"
          test -f "$runtime_root/natives/libtinygl4angle.dylib"

      - name: Build the game runtime library
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          runtime_root="$(pwd)/apps/app/gen/apple/GameRuntime"
          source="$(pwd)/apps/app/ios"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          # The library carries every symbol the game resolves by name, including
          # the windowing and graphics entry points and the launch calls, so the
          # launcher and the game share one copy of the runtime.
          clang -dynamiclib -arch arm64 -isysroot "$sdk" -mios-version-min=16.0 \
            -fobjc-arc -I"$source" \
            -F"$runtime_root/Frameworks" -framework libEGL -framework libGLESv2 \
            -Wl,-rpath,@loader_path/Frameworks \
            -framework Foundation -framework UIKit -framework QuartzCore \
            -framework Metal \
            "$source/AxolotlGame.m" "$source/AxolotlControls.m" \
            "$source/AxolotlJVM.m" \
            -o "$runtime_root/AngelAuraAmethyst"
          test -f "$runtime_root/AngelAuraAmethyst"

      - name: Sign the staged runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          runtime_root="$(pwd)/apps/app/gen/apple/GameRuntime"
          # The runtime ships as code the application loads at run time, so each
          # binary needs its own signature. Signing happens on the staged files
          # because the bundle copies them verbatim.
          find "$runtime_root" -type f \( -name '*.dylib' -o -name 'AngelAuraAmethyst' -o -path '*.framework/lib*' \) -print0 |
            while IFS= read -r -d '' binary; do
              codesign --force --sign - --timestamp=none "$binary"
            done
          find "$runtime_root" -name '*.dylib' | wc -l
          codesign --verify --strict "$runtime_root/AngelAuraAmethyst"
          codesign --verify --strict "$runtime_root/natives/libgl4es_114.dylib"
          codesign --verify --strict "$runtime_root/natives/libtinygl4angle.dylib"
          codesign --verify --strict "$runtime_root/Frameworks/libEGL.framework/libEGL"
          codesign --verify --strict "$runtime_root/java_runtimes/jre21/lib/libjli.dylib"
          codesign --verify --strict "$runtime_root/java_runtimes/jre21/lib/server/libjvm.dylib"

      - name: Save the staged runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: apps/app/gen/apple/GameRuntime
          key: ios-runtime-${{ hashFiles('apps/app/ios/**') }}-f98c4133-jre21

      - name: Build frontend
        run: pnpm turbo run build --filter=@modrinth/app-frontend

      - name: Build unsigned app
        shell: bash
        run: |
          set -o pipefail
          cd apps/app
          pnpm exec tauri ios build --no-sign --debug --target aarch64 2>&1 | tee "$RUNNER_TEMP/ios-build.log"

      - name: Inspect the package
        shell: bash
        run: |
          ipa="$(find apps/app/gen/apple/build -name '*.ipa' -print -quit)"
          echo "ipa=$ipa" >> "$GITHUB_STEP_SUMMARY"
          test -n "$ipa"
          unzip -l "$ipa" | head -40
          rm -rf "$RUNNER_TEMP/payload"
          mkdir -p "$RUNNER_TEMP/payload"
          unzip -q "$ipa" -d "$RUNNER_TEMP/payload"
          app="$(find "$RUNNER_TEMP/payload/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          echo "app=$app" >> "$GITHUB_STEP_SUMMARY"
          test -f "$app/GameRuntime/AngelAuraAmethyst"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"
          if [ -d "$app/_CodeSignature" ]; then
            echo 'package is signed' >&2
            exit 1
          fi
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo -archs "$app/$executable"
          echo "$(find "$app" -name '_CodeSignature' -type d | wc -l) signed entries" >> "$GITHUB_STEP_SUMMARY"
          test "$(find "$app" -name '_CodeSignature' -type d | wc -l)" -gt 0
          echo "$ipa" > "$RUNNER_TEMP/ipa-path"

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axolotl-ios-unsigned
          path: apps/app/gen/apple/build/**/*.ipa
          overwrite: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-package-logs
          path: ${{ runner.temp }}/ios-build.log
          overwrite: true
          retention-days: 7
          if-no-files-found: warn
